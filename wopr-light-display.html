<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#08090a">
<title>WOPR — Indicator Array</title>
<style>
:root{color-scheme:dark;--black:#08090a;--panel:#171819}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--black)}
body{display:grid;place-items:center}
.panel{
  position:relative;
  width:100vw;height:100vh;
  display:grid;place-items:center;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 50%,#211610 0%,#11100f 47%,#08090a 78%),
    #08090a;
}
.panel:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,#ffffff05,transparent 12%,transparent 88%,#0006),
             radial-gradient(ellipse at center,transparent 44%,#0008 100%);
  z-index:2;
}
.array{
  width:min(94vw, calc(94vh * 4.1));
  aspect-ratio:4.1/1;
  display:grid;
  grid-template-columns:repeat(32,minmax(0,1fr));
  grid-template-rows:repeat(6,minmax(0,1fr));
  gap:clamp(4px,1.1vw,15px);
  padding:clamp(12px,2vw,26px) clamp(13px,2.7vw,34px);
  position:relative;
  background:linear-gradient(100deg,#241d19 0%,#101112 8%,#191919 50%,#111213 92%,#2a1b15 100%);
  border:1px solid #302721;
  box-shadow:
    0 0 0 1px #000,
    inset 0 0 22px 7px #000,
    0 0 55px 13px #e54b1414,
    0 18px 45px #000a;
}
.array:before{
  content:"";position:absolute;inset:5px;pointer-events:none;
  border:1px solid #ffffff08;
  background:linear-gradient(90deg,#0009,transparent 10%,transparent 90%,#0009);
}
.led{
  position:relative;z-index:1;aspect-ratio:1;border-radius:50%;
  align-self:center;justify-self:center;width:100%;max-width:clamp(7px,2.15vw,27px);
  background:radial-gradient(circle at 38% 34%,#55402e 0 10%,#34271f 38%,#171412 72%);
  box-shadow:inset 0 2px 4px #000c,0 0 0 1px #0008;
  transition:background .16s,box-shadow .16s,opacity .16s;
}
.led.on{
  background:radial-gradient(circle at 34% 30%,#fff9d8 0 7%,color-mix(in srgb,var(--glow) 72%,white) 20%,var(--glow) 61%,color-mix(in srgb,var(--glow) 63%,#200a03) 100%);
  box-shadow:0 0 5px 1px var(--glow),0 0 13px 3px color-mix(in srgb,var(--glow) 60%,transparent),0 0 27px 6px color-mix(in srgb,var(--glow) 24%,transparent),inset 0 1px 3px #fff9;
}
.array.server-view{column-gap:clamp(2px,.5vw,7px);row-gap:4px;aspect-ratio:3.2/1}
.array.server-view .led{max-width:17px}
.rack{position:relative;width:min(94vw, calc(94vh * 4.1));display:grid;gap:5px;padding:12px 24px;border:1px solid #302721;background:linear-gradient(100deg,#241d19,#101112 8%,#191919 50%,#111213 92%,#2a1b15);box-shadow:inset 0 0 18px #000;z-index:3;font:clamp(12px,1vw,16px) ui-monospace,Consolas,monospace;color:#d2c3aa}
.display{display:grid;justify-items:center;gap:14px;max-height:94vh}
.machine{display:grid;grid-template-columns:12px 140px 215px 1fr;align-items:center;gap:14px;min-height:26px}
.machine strong{color:#ffe0a2;font-weight:normal;letter-spacing:.04em}
.machine-state{color:#ffc13e;font-size:.85em}
.machine[data-state=live] .machine-state{color:#b6ef84}
.machine-readings{font-size:.85em;line-height:1.5}
.machine-lamp{width:9px;height:9px;border-radius:50%;background:#ffc13e;box-shadow:0 0 9px #ffc13e}
.machine[data-state=live] .machine-lamp{background:#b6ef84;box-shadow:0 0 9px #b6ef84}
@media(max-width:1100px){.machine{grid-template-columns:10px 125px 190px 1fr;gap:8px}.machine-readings{font-size:11px}}
@media(max-width:600px){.rack{width:97vw;padding:10px}.display{gap:10px}.machine{grid-template-columns:10px 1fr 1.5fr;gap:6px}.machine-readings{grid-column:2 / -1}.machine-state{font-size:10px}}
@media(max-height:550px) and (min-width:601px){.display{gap:6px}.array{width:min(94vw,calc(45vh * 4.1))}.array.server-view{width:min(94vw,calc(45vh * 3.2))}.rack{padding:5px 14px;gap:0}.machine{min-height:22px}}
.metric-label{z-index:3;align-self:center;font:clamp(10px,1vw,14px) ui-monospace,monospace;color:#c3c7c7;letter-spacing:.04em}
.controls{
  position:fixed;z-index:5;left:50%;bottom:12px;transform:translate(-50%,12px);
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:#090b0de8;border:1px solid #303334;border-radius:4px;
  opacity:0;transition:opacity .3s,transform .3s;
  font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:#abb1b1;
}
body:hover .controls,body:focus-within .controls,.controls.show{opacity:.92;transform:translate(-50%,0)}
button{background:#171b1d;border:1px solid #4b5051;color:#d8dddd;border-radius:2px;padding:7px 10px;font:inherit;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
button:hover{background:#262b2d}
.speed{display:flex;align-items:center;gap:7px;letter-spacing:.08em}
input{width:85px;accent-color:#ed7140}
@media(max-width:600px){
 .array{width:97vw;aspect-ratio:2.1/1;grid-template-columns:repeat(22,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:4px;padding:10px}
 .led{max-width:22px}
 .array.server-view{column-gap:2px;row-gap:2px;aspect-ratio:1.45/1}
 .metric-label{font-size:10px;letter-spacing:0}
 .array.server-view .led{max-width:9px}
 .controls{bottom:7px;gap:4px;padding:6px 5px;font-size:9px}
 button{padding:6px 5px}
 input{width:55px}
}
@media(prefers-reduced-motion:reduce){.led{transition:none}}
</style>
</head>
<body>
<main class="panel" aria-label="Full-screen WOPR-inspired indicator light panel">
 <div class="display">
  <div class="array" id="array" role="img" aria-label="Rows of glowing red, orange, amber, pale yellow and green indicator lights"></div>
  <section class="rack" id="machines" aria-label="Machine telemetry"></section>
 </div>
</main>
<div class="controls" id="controls" aria-label="Display controls">
  <button id="toggle" type="button">Pause</button>
  <button id="mode" type="button" aria-pressed="false">Server</button>
  <button id="next" type="button">Pattern</button>
  <label class="speed">RATE <input id="speed" type="range" min="70" max="600" value="210" aria-label="Flashing speed"></label>
  <button id="full" type="button">Full screen</button>
</div>
<div id="health-status" role="status" style="position:fixed;top:12px;left:0;right:0;text-align:center;color:#abb1b1;font:12px ui-monospace,monospace;pointer-events:none" hidden></div>
<script src="/assets/wopr-light-display.js?v=20261001-rack"></script>
</body>
</html>
