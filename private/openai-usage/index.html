<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OpenAI Usage · Private</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#06100f;color:#e4f3f1}body{max-width:1040px;margin:5vh auto;padding:24px}h1{font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.04em}p,small{color:#9bb5af}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{border:1px solid #254b48;background:#0b1e1b;border-radius:16px;padding:22px}.amount{font-size:2rem;margin:16px 0}button{background:#9fe9d9;border:0;border-radius:9px;padding:12px 20px;font-weight:700;cursor:pointer}a{color:#9fe9d9}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
</style></head><body><header><div><small>PRIVATE · TAILSCALE</small><h1>OpenAI usage</h1><p>Four-account overview · API costs and account shortcuts</p></div><button id="refresh">Refresh</button></header><p id="status" role="status">Loading…</p><main id="cards" class="grid"></main><p>ChatGPT and Codex remaining quotas are not exposed by a supported public API. API credits remaining are also not inferred from expenditure.</p><p><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT</a> · <a href="https://platform.openai.com/usage" target="_blank" rel="noopener noreferrer">API usage</a></p>
<script>
const cards=document.getElementById('cards'),status=document.getElementById('status');
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;x.textContent=text;return x}
async function load(){status.textContent='Refreshing…';try{const r=await fetch('/api/usage',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();cards.replaceChildren();for(const a of data.accounts){const card=el('section','card','');card.append(el('small','',a.type.toUpperCase()),el('h2','',a.name),el('div','amount',a.spend_usd===null?'Not available':'$'+a.spend_usd.toFixed(2)),el('small','',a.type==='api'?'Month-to-date API cost · '+a.status:'ChatGPT/Codex · manual check'));cards.append(card)}status.textContent='Updated '+new Date(data.updated_at).toLocaleString()}catch(e){status.textContent='Unable to retrieve usage: '+e.message}}
document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
